name: Real-data verification
on: [push, pull_request, workflow_dispatch]
jobs:
  real-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e .
      - run: ml-adv-sec --config configs/quick.yaml prepare --download
      - run: pytest
      - run: ml-adv-sec --config configs/quick.yaml verify-all
